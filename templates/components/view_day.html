<!-- VIEW 1: DAY VIEW (MỖI NGÀY) -->
<div id="view-day" class="space-y-4 hidden animate-in fade-in duration-150">
  
  <!-- Day Selector Strip (Thứ 2 -> Chủ Nhật) -->
  <div class="bg-white dark:bg-slate-900 rounded-2xl p-2.5 border border-slate-200/90 dark:border-slate-800 shadow-sm flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar transition-colors">
    <div class="flex items-center space-x-1 shrink-0">
      <button onclick="prevDay()" class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition" title="Ngày trước">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>
      <button onclick="locateTodayOnCalendar()" class="px-2.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900 transition text-xs font-bold border border-indigo-200 dark:border-indigo-800" title="Định vị về ngày hôm nay">
        <i class="fa-solid fa-crosshairs mr-1"></i> Hôm nay
      </button>
    </div>

    <div class="flex items-center gap-1.5 flex-1 min-w-[620px] justify-between" id="day-selector-pills">
      <!-- Populated by JS: 7 pills for T2 -> CN -->
    </div>

    <button onclick="nextDay()" class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition shrink-0" title="Ngày sau">
      <i class="fa-solid fa-chevron-right text-xs"></i>
    </button>
  </div>

  <!-- Day Focus Theme & Stats Banner -->
  <div id="day-theme-banner" class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-4 sm:p-5 text-white shadow-md border border-indigo-900/50">
    <!-- Rendered by JS -->
  </div>

  <!-- Day Body: 2 Columns Layout -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    
    <!-- Left: Hourly Visual Timeline (05:00 to 23:00) -->
    <div class="lg:col-span-7 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col transition-colors">
      <div class="p-3.5 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-clock text-indigo-600 dark:text-indigo-400"></i>
          <span class="font-bold text-xs text-slate-800 dark:text-slate-200">Khung thời gian trực quan (05:00 – 23:00)</span>
        </div>
        <button onclick="openModalForSelectedDay()" class="text-[11px] font-bold text-indigo-600 dark:text-indigo-300 hover:text-indigo-800 dark:hover:text-indigo-200 bg-indigo-50 dark:bg-indigo-950/80 hover:bg-indigo-100 dark:hover:bg-indigo-900 px-2.5 py-1 rounded-lg transition border border-indigo-200 dark:border-indigo-800">
          <i class="fa-solid fa-plus mr-1"></i> Thêm vào ngày này
        </button>
      </div>

      <div class="p-2 overflow-x-auto custom-scrollbar flex-1">
        <div class="relative grid grid-cols-12 min-w-[420px]" id="day-timeline-body">
          <!-- Hours column (cols 2) -->
          <div class="col-span-2 border-r border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-950/60 select-none" id="day-timeline-hours-col">
          </div>
          <!-- Events column (cols 10) -->
          <div class="col-span-10 relative bg-white dark:bg-slate-900" id="day-timeline-events-col">
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Chronological Detailed Agenda Stream -->
    <div class="lg:col-span-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col transition-colors">
      <div class="p-3.5 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-indigo-600 dark:text-indigo-400"></i>
          <span class="font-bold text-xs text-slate-800 dark:text-slate-200">Lộ trình thứ tự chi tiết</span>
        </div>
        <span id="day-agenda-count-badge" class="text-[11px] font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700">
          0 hoạt động
        </span>
      </div>

      <div class="p-3 space-y-2.5 overflow-y-auto max-h-[850px] custom-scrollbar flex-1" id="day-agenda-stream">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

</div>
